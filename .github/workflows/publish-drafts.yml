name: Publish Scheduled Blog Drafts

on:
  schedule:
    # Monday & Thursday 05:00 UTC = 08:00 EAT, 1 post per run = 2 posts/week
    - cron: '0 5 * * 1,4'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many drafts to publish (default 1)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: publish-drafts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish next draft(s)
        run: node scripts/publish-drafts.mjs "${{ inputs.count || '1' }}"
      - name: Commit and push published posts
        run: |
          if git diff --quiet; then
            echo "No drafts left to publish - nothing committed"
            exit 0
          fi
          git config user.name "GVP Blog Bot"
          git config user.email "blog-bot@globalvillagepublishers.co.ke"
          git add content/
          git commit -m "Publish scheduled blog post(s) [bot]"
          git push origin master
